# TEMPORARY: proves packaging/macos/build-release.sh and the packaged macOS
# app on a GitHub macOS arm64 runner while the release graph is built.
# Removed before the branch merges.
name: macOS app probe

on:
  push:
    branches: [yellow-stick/desktop-releases]
    paths: [.github/workflows/macos-app-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-probe
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PROBE: ${{ github.workspace }}/probe-out
      APP: /Applications/Hermuse Agent.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flutter SDK (pinned archive) and Xcode
        run: |
          set -euo pipefail
          lock=tool/release/toolchain.lock.json
          url=$(jq -er '.flutter.archives["macos-arm64"].url' "$lock")
          sha=$(jq -er '.flutter.archives["macos-arm64"].sha256' "$lock")
          curl -fsSL --proto '=https' --retry 3 -o "$RUNNER_TEMP/flutter.zip" "$url"
          echo "$sha  $RUNNER_TEMP/flutter.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/flutter.zip"
          echo "$RUNNER_TEMP/flutter/bin" >>"$GITHUB_PATH"
          sudo xcode-select -s "$(jq -er .macos.xcode.path "$lock")"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics --no-cli-animations
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: build-release.sh (unsigned)
        run: |
          set -euo pipefail
          start=$SECONDS
          HERMUSE_RELEASE_WORK_DIR="$RUNNER_TEMP/hermuse-macos-release" packaging/macos/build-release.sh
          echo "build-release.sh: $((SECONDS - start)) s"
          cat dist/macos/VERSION.json dist/macos/SHA256SUMS.txt

      - name: Probe tools (Vision OCR, window list, pointer events)
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools" "$PROBE"
          cat >"$tools/ocr.swift" <<'EOF'
          // Prints "x<TAB>y<TAB>w<TAB>h<TAB>text" per recognised line, in image pixels (top-left origin).
          import AppKit
          import Vision
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let image = NSImage(contentsOf: url),
                let cg = image.cgImage(forProposedRect: nil, context: nil, hints: nil) else { exit(2) }
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = false
          try VNImageRequestHandler(cgImage: cg).perform([request])
          let w = Double(cg.width), h = Double(cg.height)
          for observation in request.results ?? [] {
            guard let text = observation.topCandidates(1).first?.string else { continue }
            let b = observation.boundingBox
            print("\(Int(b.minX * w))\t\(Int((1 - b.maxY) * h))\t\(Int(b.width * w))\t\(Int(b.height * h))\t\(text)")
          }
          EOF
          cat >"$tools/windows.swift" <<'EOF'
          // On-screen windows: owner<TAB>title<TAB>x,y,w,h<TAB>pid
          import CoreGraphics
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in list {
            let owner = window[kCGWindowOwnerName as String] as? String ?? ""
            let title = window[kCGWindowName as String] as? String ?? ""
            let pid = window[kCGWindowOwnerPID as String] as? Int ?? 0
            let b = window[kCGWindowBounds as String] as? [String: Any] ?? [:]
            print("\(owner)\t\(title)\t\(b["X"] ?? 0),\(b["Y"] ?? 0),\(b["Width"] ?? 0),\(b["Height"] ?? 0)\t\(pid)")
          }
          EOF
          cat >"$tools/click.swift" <<'EOF'
          // click <x> <y>: a left click at screen point (x, y).
          import CoreGraphics
          import Foundation
          let point = CGPoint(x: Double(CommandLine.arguments[1])!, y: Double(CommandLine.arguments[2])!)
          let source = CGEventSource(stateID: .hidSystemState)
          for type in [CGEventType.mouseMoved, .leftMouseDown, .leftMouseUp] {
            CGEvent(mouseEventSource: source, mouseType: type, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
            usleep(120_000)
          }
          EOF
          for tool in ocr windows click; do
            xcrun swiftc -O -o "$tools/$tool" "$tools/$tool.swift"
          done
          echo "$tools" >>"$GITHUB_PATH"

      - name: Install from the dmg and launch like a user
        run: |
          set +e -uo pipefail
          out="$PROBE/1-launch"
          mkdir -p "$out"
          dmg=$(ls dist/Hermuse-Agent-*-macos-arm64.dmg)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/hermuse-dmg
          ls -la /tmp/hermuse-dmg | tee "$out/dmg-contents.txt"
          ditto "/tmp/hermuse-dmg/Hermuse Agent.app" "$APP"
          hdiutil detach /tmp/hermuse-dmg
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee "$out/codesign-verify.txt"
          codesign -dvvv "$APP" 2>&1 | tee "$out/codesign-app.txt"
          codesign -dvvv "$APP/Contents/MacOS/cliproxy" 2>&1 | tee "$out/codesign-cliproxy.txt"
          spctl --assess --type execute -vv "$APP" 2>&1 | tee "$out/gatekeeper.txt"
          lipo -archs "$APP/Contents/MacOS/Hermuse Agent" "$APP/Contents/MacOS/cliproxy" | tee "$out/archs.txt"
          plutil -p "$APP/Contents/Info.plist" | tee "$out/info-plist.txt"
          shasum -a 256 "$APP/Contents/MacOS/cliproxy" | tee "$out/cliproxy.sha256"
          jq -r .cliproxy.binary_sha256 dist/macos/VERSION.json | tee -a "$out/cliproxy.sha256"
          security find-generic-password -s com.yellowstick.hermuseApp >"$out/keychain-before.txt" 2>&1
          echo "items of the Hermuse service before launch: exit $?" | tee -a "$out/keychain-before.txt"
          (cd /tmp && open --stdout "$out/app.out" --stderr "$out/app.err" "$APP")
          for _ in $(seq 60); do
            windows | awk -F'\t' '$1 == "Hermuse Agent" { found = 1 } END { exit !found }' && break
            sleep 1
          done
          sleep 8
          windows | tee "$out/windows.txt"
          pgrep -lf "Hermuse Agent" | tee "$out/pgrep.txt"
          screencapture -x "$out/launch.png"
          ocr "$out/launch.png" | tee "$out/launch-ocr.tsv"
          security find-generic-password -s com.yellowstick.hermuseApp >"$out/keychain-after.txt" 2>&1
          echo "items of the Hermuse service after the launch probe: exit $?" | tee -a "$out/keychain-after.txt"
          log show --last 3m --style compact --predicate 'process == "Hermuse Agent"' >"$out/unified.log" 2>&1 || true
          exit 0

      - name: Missing Command Line Tools (DEVELOPER_DIR without tools)
        run: |
          set +e -uo pipefail
          out="$PROBE/2-clt"
          mkdir -p "$out"
          click_text() { # <text> <shot>: clicks the centre of the OCR line equal to <text>
            local line x y w h
            line=$(ocr "$2" | awk -F'\t' -v t="$1" '$5 == t { print; exit }')
            [ -n "$line" ] || { echo "no \"$1\" on $2"; return 1; }
            IFS=$'\t' read -r x y w h _ <<<"$line"
            click $((x + w / 2)) $((y + h / 2)) && echo "clicked \"$1\" at $((x + w / 2)),$((y + h / 2))"
          }
          pkill -x "Hermuse Agent"; sleep 3
          mkdir -p /tmp/no-developer-tools
          DEVELOPER_DIR=/tmp/no-developer-tools xcode-select -p | tee "$out/xcode-select.txt"
          (cd /tmp && open --env DEVELOPER_DIR=/tmp/no-developer-tools --stdout "$out/app.out" --stderr "$out/app.err" "$APP")
          sleep 15
          screencapture -x "$out/1-welcome.png"
          click_text "Install Hermes on this computer" "$out/1-welcome.png"
          sleep 10
          screencapture -x "$out/2-prerequisites.png"
          ocr "$out/2-prerequisites.png" | tee "$out/2-prerequisites.tsv"
          click_text "Install" "$out/2-prerequisites.png"
          sleep 8
          screencapture -x "$out/3-after-install.png"
          ocr "$out/3-after-install.png" | tee "$out/3-after-install.tsv"
          click_text "Check again" "$out/3-after-install.png"
          sleep 6
          screencapture -x "$out/4-after-check.png"
          ocr "$out/4-after-check.png" | tee "$out/4-after-check.tsv"
          pkill -x "Hermuse Agent"; sleep 3
          exit 0

      - name: Install Hermes from the packaged app
        run: |
          set +e -uo pipefail
          out="$PROBE/3-hermes"
          mkdir -p "$out"
          click_text() {
            local line x y w h
            line=$(ocr "$2" | awk -F'\t' -v t="$1" '$5 == t { print; exit }')
            [ -n "$line" ] || { echo "no \"$1\" on $2"; return 1; }
            IFS=$'\t' read -r x y w h _ <<<"$line"
            click $((x + w / 2)) $((y + h / 2)) && echo "clicked \"$1\" at $((x + w / 2)),$((y + h / 2))"
          }
          support="$HOME/Library/Application Support/com.yellowstick.hermuseApp"
          ls -la ~ | tee "$out/home-before.txt"
          shasum -a 256 ~/.zshrc ~/.bashrc ~/.profile ~/.bash_profile 2>/dev/null | tee "$out/rc-before.txt"
          ls -la ~/.local/bin 2>&1 | tee "$out/local-bin-before.txt"
          (cd /tmp && open --stdout "$out/app.out" --stderr "$out/app.err" "$APP")
          sleep 15
          screencapture -x "$out/1-welcome.png"
          click_text "Install Hermes on this computer" "$out/1-welcome.png"
          start=$SECONDS
          i=0
          while [ $((SECONDS - start)) -lt 2400 ]; do
            sleep 30
            i=$((i + 1))
            screencapture -x "$out/progress-$i.png"
            if jq -e '.finished == true' "$support/hermes-install.json" >/dev/null 2>&1; then
              echo "journal finished after $((SECONDS - start)) s"
              break
            fi
            if ocr "$out/progress-$i.png" | grep -q 'Retry this stage'; then
              echo "a stage failed after $((SECONDS - start)) s"
              break
            fi
          done
          sleep 45
          screencapture -x "$out/after-install.png"
          ocr "$out/after-install.png" | tee "$out/after-install.tsv"
          cp "$support/hermes-install.json" "$out/" 2>/dev/null
          cat "$support/hermes-install.json"
          ~/.hermes/runtime/.local/bin/hermes --version 2>&1 | tee "$out/hermes-version.txt"
          cat ~/.hermes/hermes-agent/.hermes-bootstrap-complete 2>&1 | tee "$out/bootstrap-complete.json"
          git -C ~/.hermes/hermes-agent rev-parse HEAD 2>&1 | tee "$out/checkout-head.txt"
          ls -la ~/.hermes ~/.hermes/runtime ~/.hermes/runtime/.local/bin 2>&1 | tee "$out/hermes-home.txt"
          ls -la ~/.local/bin 2>&1 | tee "$out/local-bin-after.txt"
          shasum -a 256 ~/.zshrc ~/.bashrc ~/.profile ~/.bash_profile 2>/dev/null | tee "$out/rc-after.txt"
          ls /Applications | tee "$out/applications.txt"
          pgrep -lf hermes | tee "$out/pgrep.txt"
          security find-generic-password -s com.yellowstick.hermuseApp -a hermes/hermuse-local/session_token 2>&1 |
            grep -v '"password"' | tee "$out/keychain-local-instance.txt"
          echo "local instance token in the login keychain: exit ${PIPESTATUS[0]}" | tee -a "$out/keychain-local-instance.txt"
          find ~/.hermes/bootstrap-cache -type f 2>/dev/null | tee "$out/bootstrap-cache.txt"
          exit 0

      - name: Locked keychain (no plaintext fallback)
        run: |
          set +e -uo pipefail
          out="$PROBE/4-locked-keychain"
          mkdir -p "$out"
          pkill -x "Hermuse Agent"; sleep 5
          pkill -f "hermes" ; sleep 2
          security lock-keychain ~/Library/Keychains/login.keychain-db
          security show-keychain-info ~/Library/Keychains/login.keychain-db 2>&1 | tee "$out/keychain-info.txt"
          (cd /tmp && open --stdout "$out/app.out" --stderr "$out/app.err" "$APP")
          sleep 20
          windows | tee "$out/windows.txt"
          screencapture -x "$out/locked.png"
          ocr "$out/locked.png" | tee "$out/locked.tsv"
          exit 0

      - name: Collect
        if: always()
        run: |
          mkdir -p "$PROBE/build"
          cp -R "$RUNNER_TEMP/hermuse-macos-release/evidence" "$PROBE/build/" 2>/dev/null || true
          cp -R dist "$PROBE/build/" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*Hermuse* "$PROBE/" 2>/dev/null || true
          ls -R "$PROBE" | head -100

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-app-probe
          path: probe-out

# Continuous integration of pull requests and of the merge queue: the checks,
# the unsigned packages of every platform (build.yml), then the compat smoke
# legs on those packages (smoke-legs.yml).
#
#   changes -> build (build.yml: checks, Linux, macOS and Windows packages, assembly)
#           -> compat (smoke-legs.yml, the compat legs) -> CI
#
# Triggers: a pull request opened, pushed to, reopened or marked ready for
# review, and a merge group of the merge queue. A draft runs nothing: marking
# it ready for review starts the run. A change of documentation only (docs/
# and Markdown, except under hermes-plugin/ and the app's copy of it, whose
# README and skill ship in the app) builds nothing. A new push cancels the run
# it supersedes. No secret, no signing. Of the installed-package smoke tests,
# only the compat legs run here (filter ^compat-, about a minute each): the
# .deb and the AppImage of the build installed and started in Ubuntu 24.04,
# Ubuntu 26.04 and Debian 13 containers (APT and ELF resolution, a window).
# They follow the build: no build, no compat legs. Every other scenario runs
# for a release (release.yml) and for a manual test run (smoke.yml).
#
# A tree already checked builds nothing again: the `CI` gate of a passing run
# leaves the artifact `ci-passed-<tree>`, and `changes` skips the build when a
# passing run of this repository already checked the same tree
# (tool/ci/tree-passed.sh). A pull request checked on top of the current main
# therefore goes through the merge queue in about a minute; one whose main
# moved is checked there again.
#
# Required check of main: `CI`, the last job. It runs whatever happened before
# it and passes only when every job succeeded or was skipped, so a failure
# upstream never passes as a skipped check. The web app has its own required
# check, `Web` (web-pr.yml, web-queue.yml).
#
# Actions are pinned by commit (tag in the trailing comment).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # One run per pull request; every merge group has a ref of its own.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    # Draft skip: a draft pull request runs nothing; `ready_for_review` starts its run.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the artifacts of earlier runs (tool/ci/tree-passed.sh)
    outputs:
      code: ${{ steps.scope.outputs.code }}
      tree: ${{ steps.tested.outputs.tree }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges onto.
          fetch-depth: 2

      - name: Whether the change touches more than documentation
        id: scope
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # A merge group is compared with its base commit, fetched; a pull
          # request with the first parent of its merge commit.
          if [ -n "$MERGE_GROUP_BASE" ]; then base=$MERGE_GROUP_BASE; else base=$(git rev-parse HEAD^1); fi
          code=true
          # A change set that cannot be computed builds everything.
          if { [ -z "$MERGE_GROUP_BASE" ] || git fetch -q --no-tags --depth=1 origin "$base"; } &&
            git diff --name-only "$base" HEAD >"$RUNNER_TEMP/changed"; then
            echo "Changed against $base:"
            cat "$RUNNER_TEMP/changed"
            # Documentation only: docs/ and Markdown, except under hermes-plugin/
            # and the app's copy of it, whose README and skill ship in the app.
            if [ -s "$RUNNER_TEMP/changed" ]; then
              code=false
              while IFS= read -r file; do
                case $file in
                  hermes-plugin/* | apps/hermuse_app/assets/*) code=true ;;
                  docs/* | *.md) ;;
                  *) code=true ;;
                esac
              done <"$RUNNER_TEMP/changed"
            fi
          else
            echo "::warning::no change set against '$base': everything is built"
          fi
          [ "$code" = true ] || echo "::notice::documentation only: nothing to build"
          echo "code=$code" >>"$GITHUB_OUTPUT"

      - name: Whether this exact tree already passed
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"
          echo "tested=$(tool/ci/tree-passed.sh ci-passed .github/workflows/ci.yml)" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    # Documentation-only filter, and a tree a passing run already checked: nothing to build.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true'
    # Unsigned, every platform, no tag: the defaults of build.yml, without secrets.
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  compat:
    name: Compat
    needs: build
    # The compat legs on the packages of this build: skipped with the build.
    uses: ./.github/workflows/smoke-legs.yml
    permissions:
      contents: read
    with:
      set: full
      filter: ^compat-
      commit: ${{ needs.build.outputs.commit }}
      run_label: ${{ needs.build.outputs.run_label }}
      fixture_deb_file: ${{ needs.build.outputs.fixture_deb_file }}

  ci:
    name: CI
    needs: [changes, build, compat]
    # Gate: always runs, to fail when a job above failed or was cancelled.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi

      # A draft has no tree (changes skipped): nothing to record.
      - name: Record the tree that passed
        if: needs.changes.outputs.tree != ''
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" >"$RUNNER_TEMP/tree"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Same condition as the step above.
        if: needs.changes.outputs.tree != ''
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/tree
          retention-days: 14

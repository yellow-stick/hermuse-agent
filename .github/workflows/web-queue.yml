# Web app and read-only demo of a merge group (merge queue): build only,
# nothing is deployed.
#
#   changes -> build (web-build.yml) -> Web
#
# Trigger: a merge group of the merge queue. `changes` compares the merge
# group with its base commit; when none of the web inputs changed (demo,
# apps/hermuse_web, packages, pubspec.*, netlify.toml, the toolchain lock, the
# web workflows), nothing is built. The demo is deployed to production once the
# change is on main (web-deploy.yml).
#
# A tree already checked builds nothing again: when a passing `Web` gate of
# this repository (here or on a pull request, web-pr.yml) already checked the
# same tree, the build is skipped (tool/ci/tree-passed.sh).
#
# Required check of main: `Web`, the last job, here and on pull requests
# (web-pr.yml). It runs whatever happened before it and passes only when every
# job succeeded or was skipped. When it passes it leaves the artifact
# `web-passed-<tree>`.
#
# Actions are pinned by commit (tag in the trailing comment).
name: Web queue

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the artifacts of earlier runs (tool/ci/tree-passed.sh)
    outputs:
      web: ${{ steps.paths.outputs.web }}
      tree: ${{ steps.tested.outputs.tree }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Does the change touch the web app
        id: paths
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          web=true
          # The merge group's base commit is fetched; a change set that cannot
          # be computed builds.
          if git fetch -q --no-tags --depth=1 origin "$BASE" &&
            git diff --name-only "$BASE" HEAD >"$RUNNER_TEMP/changed"; then
            echo "Changed against $BASE:"
            cat "$RUNNER_TEMP/changed"
            web=false
            while IFS= read -r file; do
              # The web inputs (listed in web-pr.yml and web-deploy.yml too), the web workflows.
              case $file in
                demo/* | apps/hermuse_web/* | packages/* | pubspec.yaml | pubspec.lock | netlify.toml | \
                  tool/release/toolchain.lock.json | .github/workflows/web-*.yml) web=true ;;
              esac
            done <"$RUNNER_TEMP/changed"
          fi
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"
      - name: Whether this exact tree already passed
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"
          echo "tested=$(tool/ci/tree-passed.sh web-passed .github/workflows/web-pr.yml .github/workflows/web-queue.yml)" |
            tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    # Web paths filter, and a tree a passing run already checked: nothing to build.
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.tested != 'true'
    uses: ./.github/workflows/web-build.yml
    permissions:
      contents: read

  web:
    name: Web
    needs: [changes, build]
    # Gate: always runs, to fail when a job above failed or was cancelled.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi

      - name: Record the tree that passed
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" >"$RUNNER_TEMP/tree"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-passed-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/tree
          retention-days: 14

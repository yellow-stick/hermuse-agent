# Web app and read-only demo of a merge group (merge queue): build only,
# nothing is deployed.
#
#   changes -> build (web-build.yml) -> Web
#
# Trigger: a merge group of the merge queue. `changes` compares the merge
# group with its base commit; when none of the web inputs changed (demo,
# apps/hermuse_web, packages, pubspec.*, netlify.toml, the toolchain lock, the
# web workflows), nothing is built. The demo is deployed to production once the
# change is on main (web-deploy.yml).
#
# Required check of main: `Web`, the last job, here and on pull requests
# (web-pr.yml). It runs whatever happened before it and passes only when every
# job succeeded or was skipped.
#
# Actions are pinned by commit (tag in the trailing comment).
name: Web queue

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Does the change touch the web app
        id: paths
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          web=true
          # The merge group's base commit is fetched; a change set that cannot
          # be computed builds.
          if git fetch -q --no-tags --depth=1 origin "$BASE" &&
            git diff --name-only "$BASE" HEAD >"$RUNNER_TEMP/changed"; then
            echo "Changed against $BASE:"
            cat "$RUNNER_TEMP/changed"
            web=false
            while IFS= read -r file; do
              # The web inputs (listed in web-pr.yml and web-deploy.yml too), the web workflows.
              case $file in
                demo/* | apps/hermuse_web/* | packages/* | pubspec.yaml | pubspec.lock | netlify.toml | \
                  tool/release/toolchain.lock.json | .github/workflows/web-*.yml) web=true ;;
              esac
            done <"$RUNNER_TEMP/changed"
          fi
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    # Web paths filter: a change outside the web inputs builds nothing.
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-build.yml
    permissions:
      contents: read

  web:
    name: Web
    needs: [changes, build]
    # Gate: always runs, to fail when a job above failed or was cancelled.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi

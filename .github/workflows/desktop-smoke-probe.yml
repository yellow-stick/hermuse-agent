# TEMPORARY iteration harness of the macOS/Windows smoke legs of release.yml
# (same package and smoke steps, without the Linux graph). Removed before the
# branch merges.
name: Desktop smoke probe

on:
  push:
    branches: [yellow-stick/desktop-releases]
    paths:
      - .github/workflows/desktop-smoke-probe.yml
      - packaging/smoke/macos.sh
      - packaging/smoke/windows.ps1
      - packaging/smoke/desktop/**

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-smoke-probe
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      # A run of this workflow whose macos-dist/windows-dist to test again; empty = build.
      reuse: ${{ steps.reuse.outputs.run }}
      os: ${{ steps.reuse.outputs.os }}
    steps:
      - id: reuse
        run: |
          echo "run=" >>"$GITHUB_OUTPUT"
          echo "os=both" >>"$GITHUB_OUTPUT"

  package-macos:
    needs: setup
    if: needs.setup.outputs.reuse == '' && needs.setup.outputs.os != 'windows'
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode and the Flutter SDK from toolchain.lock.json
        run: |
          set -euo pipefail
          lock=tool/release/toolchain.lock.json
          sudo xcode-select -s "$(jq -er .macos.xcode.path "$lock")"
          curl -fsSL --proto '=https' --retry 3 -o "$RUNNER_TEMP/flutter.zip" "$(jq -er '.flutter.archives["macos-arm64"].url' "$lock")"
          echo "$(jq -er '.flutter.archives["macos-arm64"].sha256' "$lock")  $RUNNER_TEMP/flutter.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics --no-cli-animations
          echo "$RUNNER_TEMP/flutter/bin" >>"$GITHUB_PATH"
      - run: packaging/macos/build-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dist
          path: |
            dist/*.dmg
            dist/macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  smoke-macos:
    needs: [setup, package-macos]
    if: always() && needs.setup.outputs.os != 'windows' && (needs.package-macos.result == 'success' || needs.setup.outputs.reuse != '')
    runs-on: macos-15
    timeout-minutes: 150
    env:
      LEG: smoke-macos-15-fresh-dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dist
          path: dist
          run-id: ${{ needs.setup.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}
      - run: cd dist && shasum -a 256 -c macos/SHA256SUMS.txt
      - run: brew install tesseract imagemagick cliclick
      - run: |
          packaging/smoke/macos.sh fresh --dist dist --out "$RUNNER_TEMP/legs/$LEG" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" --runner macos-15 || echo "::warning::scenario runner exited with $?"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-macos-15-fresh-dmg
          path: ${{ runner.temp }}/legs/smoke-macos-15-fresh-dmg
          if-no-files-found: error
          retention-days: 7
      - run: python3 packaging/smoke/proof_summary.py leg "$RUNNER_TEMP/legs/$LEG" fresh --target macos-15

  package-windows:
    needs: setup
    if: needs.setup.outputs.reuse == '' && needs.setup.outputs.os != 'macos'
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Flutter SDK from toolchain.lock.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = (Get-Content tool/release/toolchain.lock.json -Raw | ConvertFrom-Json).flutter.archives.'windows-x64'
          $zip = Join-Path $env:RUNNER_TEMP flutter.zip
          Invoke-WebRequest -Uri $entry.url -OutFile $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sha -ne $entry.sha256) { throw "Flutter archive sha256 $sha" }
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP 'flutter\bin'
          & "$bin\flutter.bat" config --no-analytics --no-cli-animations
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/windows/build-release.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  smoke-windows:
    needs: [setup, package-windows]
    if: always() && needs.setup.outputs.os != 'macos' && (needs.package-windows.result == 'success' || needs.setup.outputs.reuse != '')
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      LEG: smoke-windows-2025-fresh-setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dist
          path: dist
          run-id: ${{ needs.setup.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}
      - shell: bash
        run: cd dist && sha256sum -c windows/SHA256SUMS.txt
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = (Get-Content tool/release/toolchain.lock.json -Raw | ConvertFrom-Json).ci.tesseract_windows
          $setup = Join-Path $env:RUNNER_TEMP tesseract-setup.exe
          Invoke-WebRequest -Uri $entry.url -OutFile $setup
          $sha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($sha -ne $entry.sha256) { throw "tesseract installer sha256 $sha" }
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          & "$env:ProgramFiles\Tesseract-OCR\tesseract.exe" --version
      - shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/smoke/windows.ps1 -Scenario fresh -Dist dist `
            -Out (Join-Path $env:RUNNER_TEMP "legs\$env:LEG") -RunId "${{ github.run_id }}-${{ github.run_attempt }}" -Runner windows-2025
          if ($LASTEXITCODE) { "::warning::scenario runner exited with $LASTEXITCODE" }
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-windows-2025-fresh-setup
          path: ${{ runner.temp }}/legs/smoke-windows-2025-fresh-setup
          if-no-files-found: error
          retention-days: 7
      - shell: bash
        run: python packaging/smoke/proof_summary.py leg "$RUNNER_TEMP/legs/$LEG" fresh --target windows-2025

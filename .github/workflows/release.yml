# Release of Hermuse Agent, one graph for every platform: Linux .deb +
# AppImage (amd64, from one Flutter bundle), macOS .dmg (arm64), Windows
# Setup.exe (x64).
#
#   tag -> build (build.yml, signed) -> smoke (smoke-legs.yml, every leg) -+
#                                    -> attest ----------------------------+-> release-approval -> publish
#
# Triggers: a pushed hermuse/v* tag, or a dispatch on an existing tag with
# `tag` set to it, to run its release again:
# `gh workflow run release.yml --ref hermuse/vX.Y.Z -f tag=hermuse/vX.Y.Z`.
# This is the only workflow that publishes. Its first job runs in the
# canonical repository only, so a fork never releases; every other job follows
# it through `needs`.
#
# The tag must have the form hermuse/vX.Y.Z[-rc.N], the run must be on it, it
# must resolve to the run's commit and name exactly the pubspec version
# (tool/release/release-metadata.sh, in build.yml); that exact commit is
# checked, built, packaged and runs every smoke leg. The macOS and Windows
# package jobs take their signing secrets from the `signing` environment (no
# reviewer: it deploys from hermuse/v* tags only, which only administrators
# create); a platform without them builds unsigned and records why. The one
# approval of a release is the `release` environment (required reviewer; it
# holds the model test account): Release approval runs the real conversation,
# then Publish creates a public PRE-RELEASE with the tested bytes of every
# platform, never marked latest. A failed or missing automated result blocks
# the publication. What the run could not prove (no model test account,
# unsigned macOS/Windows artifacts, manual gates, the checks outside CI) is
# listed under "Not yet proven" in the release notes; once they are checked,
# promote it by hand: `gh release edit <tag> --prerelease=false --latest`. A
# published asset is never replaced.
#
# Actions are pinned by commit (tag in the trailing comment, resolved
# 2026-09-29 with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`); external
# tools by URL + SHA-256 in tool/release/toolchain.lock.json and
# tool/release/guest-images.lock.json.
name: Release

on:
  push:
    tags: ['hermuse/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (hermuse/vX.Y.Z or hermuse/vX.Y.Z-rc.N) to release again; dispatch the workflow on that tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Release tag
    # Fork guard: only the canonical repository releases; the other jobs follow through `needs`.
    if: github.repository == 'yellow-stick/hermuse-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: The tag, the ref of the run and the tagged commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=${INPUT_TAG:-$REF_NAME}
          if ! [[ $tag =~ ^hermuse/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::'$tag' is not a hermuse/vX.Y.Z[-rc.N] tag"
            exit 1
          fi
          # A release runs on its tag, pushed or dispatched: the workflow of the
          # tagged commit, and the signing and release environments, which only
          # deploy from hermuse/v* tags.
          if [ "$REF" != "refs/tags/$tag" ]; then
            echo "::error::a release runs on its tag: gh workflow run release.yml --ref $tag -f tag=$tag"
            exit 1
          fi
          # Existing tags only, dereferenced to the commit (annotated or not).
          object=$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          while [ "${object%% *}" = tag ]; do
            object=$(gh api "repos/$REPOSITORY/git/tags/${object#* }" --jq '.object.type + " " + .object.sha')
          done
          [ "${object%% *}" = commit ] || { echo "::error::$tag does not point at a commit"; exit 1; }
          commit=${object#* }
          if [ "$commit" != "$EVENT_SHA" ]; then
            echo "::error::$tag resolves to $commit, the run is on $EVENT_SHA"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    name: Build
    needs: tag
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Azure login (OIDC) of Artifact Signing in the Windows package job, the
      # only job of build.yml that keeps this permission.
      id-token: write
    with:
      signing: true
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  smoke:
    name: Smoke
    needs: build
    uses: ./.github/workflows/smoke-legs.yml
    permissions:
      contents: read
    with:
      set: full
      commit: ${{ needs.build.outputs.commit }}
      run_label: ${{ needs.build.outputs.run_label }}
      fixture_deb_file: ${{ needs.build.outputs.fixture_deb_file }}

  attest:
    name: Provenance attestation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify the bytes to attest
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

  # The one manual step of a release: the reviewer of the `release`
  # environment approves this job, whose secrets hold the model test account.
  release-approval:
    name: Release approval
    needs: [build, attest, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    environment: release
    permissions:
      contents: read
      actions: read # read the environment's protection rules
    env:
      RUN_LABEL: ${{ needs.build.outputs.run_label }}
      WORK: /mnt/hermuse-smoke
      MODEL_LEG: model-ubuntu-22.04-fresh-deb
    steps:
      - name: The release environment really requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$REPOSITORY/environments/release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::the 'release' environment has no required reviewers: the approval gate would be a no-op"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-summary
          path: proof

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release

      - name: Model test account (release environment secrets only)
        id: model
        env:
          PROVIDER: ${{ secrets.HERMUSE_TEST_MODEL_PROVIDER }}
          MODEL: ${{ secrets.HERMUSE_TEST_MODEL_NAME }}
          API_KEY: ${{ secrets.HERMUSE_TEST_MODEL_API_KEY }}
          BASE_URL: ${{ secrets.HERMUSE_TEST_MODEL_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PROVIDER" ] || [ -z "$MODEL" ] || [ -z "$API_KEY" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::no HERMUSE_TEST_MODEL_* account: the conversation proof is missing, listed under Not yet proven in the release notes"
            exit 0
          fi
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$WORK"
          (umask 077 && {
            printf 'HERMUSE_TEST_MODEL_PROVIDER=%q\n' "$PROVIDER"
            printf 'HERMUSE_TEST_MODEL_NAME=%q\n' "$MODEL"
            printf 'HERMUSE_TEST_MODEL_API_KEY=%q\n' "$API_KEY"
            printf 'HERMUSE_TEST_MODEL_BASE_URL=%q\n' "$BASE_URL"
          } >"$WORK/model.env")
          echo "available=true" >>"$GITHUB_OUTPUT"

      - name: QEMU, KVM when the runner exposes it
        # Runtime state: only with the model test account of the release environment.
        if: steps.model.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage ffmpeg
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-hermuse-kvm.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Real conversation on a fresh ubuntu-22.04 guest (.deb)
        # Runtime state: only with the model test account of the release environment.
        if: steps.model.outputs.available == 'true'
        run: |
          set -euo pipefail
          guest=packaging/smoke/guest/guest.sh
          run="$WORK/run"
          "$guest" fetch ubuntu-22.04 "$WORK/images"
          "$guest" up ubuntu-22.04 "$WORK/images" "$run"
          scale=1
          [ "$(cat "$run/accel")" = kvm ] || scale=4
          stage=$(mktemp -d)
          cp -r packaging/smoke "$stage/hermuse-smoke"
          "$guest" push "$run" "$stage/hermuse-smoke" /opt
          "$guest" push "$run" dist /root/hermuse-release
          "$guest" ssh "$run" 'install -d -m 0700 /root/hermuse-release/secrets'
          "$guest" push "$run" "$run/tester-password" /root/hermuse-release/secrets
          "$guest" push "$run" "$run/keyring-password" /root/hermuse-release/secrets
          "$guest" push "$run" "$WORK/model.env" /root/hermuse-release/secrets
          rm -f "$WORK/model.env"
          "$guest" exec "$run" 17400 /opt/hermuse-smoke/linux.sh fresh --format deb \
            --dist /root/hermuse-release/dist --out /root/hermuse-release/out --run-id "$RUN_LABEL-model" \
            --guest ubuntu-22.04 --secrets /root/hermuse-release/secrets --timeout-scale "$scale" \
            --model-env /root/hermuse-release/secrets/model.env || echo "::warning::scenario runner exited with $?"

      - name: Collect the model evidence
        # Evidence of the model leg: collected even when the conversation failed.
        if: always() && steps.model.outputs.available == 'true'
        run: |
          set -uo pipefail
          guest=packaging/smoke/guest/guest.sh
          run="$WORK/run"
          mkdir -p "$RUNNER_TEMP/legs"
          if [ -f "$run/ssh-port" ] && "$guest" pull "$run" /root/hermuse-release/out "$RUNNER_TEMP/legs"; then
            mv "$RUNNER_TEMP/legs/out" "$RUNNER_TEMP/legs/$MODEL_LEG"
          fi
          mkdir -p "$RUNNER_TEMP/legs/$MODEL_LEG/evidence"
          leg="$RUNNER_TEMP/legs/$MODEL_LEG"
          cp "$run/console.log" "$leg/evidence/guest-console.log" 2>/dev/null || true
          if compgen -G "$leg/evidence/frames/*.jpg" >/dev/null; then
            ffmpeg -loglevel error -framerate 4 -pattern_type glob -i "$leg/evidence/frames/*.jpg" \
              -vf 'scale=trunc(iw/2)*2:trunc(ih/2)*2' -c:v libx264 -pix_fmt yuv420p "$leg/evidence/frames/run.mp4" &&
              rm -f "$leg"/evidence/frames/*.jpg
          fi
          "$guest" down "$run" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Evidence of the model leg: uploaded even when the conversation failed.
        if: always() && steps.model.outputs.available == 'true'
        with:
          name: model-ubuntu-22.04-fresh-deb
          path: ${{ runner.temp }}/legs/model-ubuntu-22.04-fresh-deb
          if-no-files-found: error
          retention-days: 90

      - name: Release proof
        id: proof
        env:
          MODEL_AVAILABLE: ${{ steps.model.outputs.available }}
        run: |
          set -euo pipefail
          model=()
          [ "$MODEL_AVAILABLE" = true ] && model=(--model "$RUNNER_TEMP/legs/$MODEL_LEG")
          python3 packaging/smoke/proof_summary.py finalize --summary proof/proof-summary.json "${model[@]}" \
            --release-version release/VERSION.json --out release-proof.json --markdown release-proof.md \
            --notes not-yet-proven.md | tee -a "$GITHUB_OUTPUT"
          cat release-proof.md >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-proof
          path: |
            release-proof.json
            release-proof.md
            not-yet-proven.md
          if-no-files-found: error
          retention-days: 90

      - name: No failed or missing automated result
        # Runtime state: the release proof found a failed or missing automated result.
        if: steps.proof.outputs.automated_ok != 'true'
        run: |
          echo "::error::a failed or missing automated result blocks the publication (see the release-proof artifact)"
          exit 1

  publish:
    name: Publish
    needs: [tag, build, release-approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.tag.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      DEB_FILE: ${{ needs.build.outputs.deb_file }}
      DMG_FILE: ${{ needs.build.outputs.dmg_file }}
      SETUP_FILE: ${{ needs.build.outputs.windows_setup_file }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-proof
          path: proof

      - name: The published bytes are the tested bytes
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          [ "$(find . -maxdepth 1 -type f | wc -l)" = 7 ]
          jq -e --arg commit "$COMMIT" --arg version "$APP_VERSION" \
            '.schema == 2 and .source.commit == $commit and .source.dirty == false and .app.version == $version
             and (.platforms | keys) == ["linux", "macos", "windows"]' VERSION.json
          # Every published artifact carries the bytes its platform job packaged and its smoke tested.
          mapfile -t files < <(jq -r '.artifacts[].name' VERSION.json)
          [ "${#files[@]}" = 5 ]
          for file in "${files[@]}"; do
            jq -e --arg n "$file" --arg sha "$(sha256sum "$file" | cut -d' ' -f1)" \
              '[.platforms[].artifacts[] | select(.name == $n and .sha256 == $sha)] | length == 1' VERSION.json
          done

      - name: No failed or missing automated result
        run: |
          jq -e '.automated_ok == true and .smoke_ok == true and .complete == true
            and .model_proof.status != "fail" and .signing_proof.status != "fail"' proof/release-proof.json

      - name: Public pre-release, never marked latest (never replaces an asset)
        run: |
          set -euo pipefail
          {
            echo "Hermuse Agent $APP_VERSION for Linux, macOS and Windows."
            echo
            echo "- Linux (amd64), Debian/Ubuntu family (Ubuntu 22.04+, Debian 12+ and derivatives):"
            echo "  \`.deb\`: \`sudo apt-get install ./$DEB_FILE\`; AppImage: mark it executable and run it,"
            echo "  no FUSE needed (it extracts to a temporary directory on each launch)."
            echo "- macOS 14+ on Apple Silicon (arm64): open \`$DMG_FILE\` and drag Hermuse Agent to Applications."
            echo "- Windows (x64): run \`$SETUP_FILE\`; it installs for the current user, without administrator rights."
            echo
            echo "On first launch the app installs Hermes and the Hermuse plugin for you; it needs network access."
            echo "On Linux it also prepares the keyring and the agent's computer image after one administrator"
            echo "authorization. On macOS and Windows the agent's computer needs a Docker engine you install yourself."
            echo "Model accounts stay yours to connect. See docs/guides/desktop.md. Source commit \`$COMMIT\`."
            echo "Checksums: SHA256SUMS.txt; build provenance: \`gh attestation verify <file> --repo $REPOSITORY\`."
            echo "The release run and its evidence: $RUN_URL"
            echo
            cat proof/not-yet-proven.md
          } >notes.md
          title="Hermuse Agent $APP_VERSION"
          existing=$(gh api "repos/$REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | {id, draft, assets: [.assets[] | {name, digest}]}")
          if [ -z "$existing" ]; then
            # gh uploads the assets to a draft, then publishes it.
            gh release create "$TAG" -R "$REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "$title" --notes-file notes.md dist/*
            exit 0
          fi
          # A re-run: the assets already there must be identical. A draft (an
          # interrupted upload) receives the missing ones and is published; a
          # published release stays as it is, never replaced nor demoted.
          draft=$(jq -r .draft <<<"$existing")
          for file in dist/*; do
            name=$(basename "$file")
            digest=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // "none"' <<<"$existing")
            if [ -z "$digest" ]; then
              if [ "$draft" != true ]; then
                echo "::error::the published $TAG has no $name: refusing to change a public release"
                exit 1
              fi
              gh release upload "$TAG" -R "$REPOSITORY" "$file"
            elif [ "$digest" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]; then
              echo "::error::$TAG already has a different $name: refusing to overwrite it"
              exit 1
            fi
          done
          if [ "$draft" = true ]; then
            gh release edit "$TAG" -R "$REPOSITORY" --draft=false --prerelease --latest=false \
              --title "$title" --notes-file notes.md
          else
            echo "::notice::$TAG is already published with these exact files: nothing to change"
          fi

      - name: The public downloads match SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir public
          gh release download "$TAG" -R "$REPOSITORY" -D public
          (cd public && sha256sum -c SHA256SUMS.txt)
          {
            echo "$TAG is published; its public downloads match SHA256SUMS.txt."
            if [ "$PRERELEASE" = true ]; then
              echo "A release candidate stays a pre-release."
            else
              echo "Once the points under \"Not yet proven\" of its notes are checked, make it the latest release:"
              echo "\`gh release edit $TAG --prerelease=false --latest\`"
            fi
            echo
            cat proof/not-yet-proven.md
          } >>"$GITHUB_STEP_SUMMARY"

# Netlify project `hermuse-demo`, served at https://demo.hermuse.app: the
# read-only demo (demo/), the static Jaspr build of apps/hermuse_web compiled
# with HERMUSE_DEMO=true, fictional chats answered in the browser. GitHub
# Actions builds it (demo/build.sh) and deploys it with the Netlify CLI
# (.github/workflows/web-deploy.yml for production, web-pr.yml for pull request
# previews under the alias pr-<N>); the project has no Git builds, so nothing
# here runs a build.
#
# Manual deploy from the repository root (after `netlify link --id <site id>`):
#   demo/build.sh
#   netlify deploy --no-build --dir=demo/build/web          # draft URL
#   netlify deploy --no-build --dir=demo/build/web --prod   # demo.hermuse.app
#
# Netlify hosts the demo only. The real web app reaches Hermes through
# apps/hermuse_relay, which serves it on the user's own server
# (docs/guides/web-app-and-relay.md); Netlify has no relay.
#
# The demo is indexable: no X-Robots-Tag here, and the demo build leaves out the
# page's robots noindex meta (apps/hermuse_web/lib/main.server.dart). The
# product homepage is https://hermuse.app (repository yellow-stick/hermuse-website).
[build]
  publish = "demo/build/web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# The service worker must never be served from an HTTP cache, or a new deploy
# waits for the old worker to expire.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sqlite3.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Not fingerprinted, but versioned by hand and rarely touched.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

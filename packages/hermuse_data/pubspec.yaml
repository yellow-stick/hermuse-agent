name: hermuse_data
description: Hermuse local storage — drift database for instances, sessions and messages. Pure Dart (native file or WASM on the web).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.4
  hermes_client: ^0.1.0
  sqlite3: ^3.9.1

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.3
  lints: ^6.1.0
  test: ^1.32.0

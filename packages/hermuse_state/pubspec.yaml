name: hermuse_state
description: Hermuse shared Riverpod state (instances, connections, sessions, chats) for the Flutter and Jaspr apps. Pure Dart.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  cliproxy_client: ^0.1.0
  hermes_client: ^0.1.0
  hermuse_chat: ^0.1.0
  hermuse_data: ^0.1.0
  hermuse_update: ^0.1.0
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  web_socket: ^1.0.1

dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.1.0
  riverpod_generator: ^4.0.9
  test: ^1.26.0

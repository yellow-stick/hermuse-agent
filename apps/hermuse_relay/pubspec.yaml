name: hermuse_relay
description: Same-origin relay proxying the Hermuse web app to registered Hermes instances. Pure Dart server.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.6.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  shelf_static: ^1.2.0
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.8.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.0

name: hermuse_web
description: Hermuse chat on the web — Jaspr, statically pre-rendered and hydrated.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  hermes_client: ^0.1.0
  hermuse_chat: ^0.1.0
  hermuse_data: ^0.1.0
  hermuse_state: ^0.1.0
  http: ^1.6.0
  jaspr: ^0.23.5
  jaspr_riverpod: ^0.4.6
  riverpod: ^3.4.3
  universal_web: ^1.1.1
  uuid: ^4.6.0
  yellow_stick_ui_core: ^0.1.0
  yellow_stick_ui_web: ^0.1.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^6.1.0
  test: ^1.26.0

jaspr:
  mode: static

name: hermuse
version: 0.1.0
description: "Hermuse product layer: Feed, Ideas, Goals, Library artifacts, Reflections and proactive preferences, stored as human-readable files under HERMES_HOME/hermuse/."
author: Yellow Stick
license: AGPL-3.0-only
kind: standalone
requires_hermes: ">=0.21,<0.22"
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - feed_post
  - idea_propose
  - goal_track
  - goal_update
  - artifact_save
  - reflection_write
